<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>screean · routing · swap</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #06050d; overflow: hidden;
        color: #e0e0ea;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .world-behind {
        position: fixed; inset: -20%; z-index: 0;
        background:
          radial-gradient(circle at 30% 40%, rgba(140, 100, 255, 0.28), transparent 40%),
          radial-gradient(circle at 70% 60%, rgba(100, 180, 255, 0.22), transparent 45%),
          radial-gradient(circle at 50% 80%, rgba(255, 160, 200, 0.10), transparent 50%);
        filter: blur(40px) saturate(1.2);
        animation: drift 90s linear infinite;
      }
      @keyframes drift {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }

      /* Pattern A: the particle canvas is an OVERLAY — full viewport, above
         the content, pointer-events:none so it never intercepts clicks. The
         dissolve theater paints on it; the REAL DOM below is the UI. */
      #portal {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: block; z-index: 50; pointer-events: none;
      }

      /* The real-DOM content host. Route views live here as actual elements
         — focus rings, tab order, and screen-reader semantics are native.
         Grid with a single cell: during a swap the outgoing and incoming
         views overlap in the same centered cell. */
      #content-host {
        position: absolute; inset: 0; z-index: 2;
        display: grid;
        place-items: center;
      }
      .route-view {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 32px;
        text-align: center;
      }
      .route-view h1 {
        margin: 0;
        font-size: clamp(28px, 5vmin, 56px);
        font-weight: 300;
        letter-spacing: -0.01em;
        color: rgba(240, 240, 248, 0.92);
      }
      .route-view p {
        margin: 0;
        font-size: clamp(12px, 1.6vmin, 16px);
        color: rgba(200, 205, 220, 0.65);
      }
      .route-row { display: flex; gap: 14px; align-items: center; }

      /* Route accents — keyed off the VIEW element, NOT :root. The
         rasterizer serializes only the view subtree into its foreignObject
         SVG, so selectors anchored on ancestors outside it (html/:root)
         would silently lose the theme during capture.

         Each route carries its accent pair (button chrome reads them as
         inline var() references) plus a three-slot particle palette around
         the route hue. Hues mirror ROUTE_HUES in src/demos/routing/constant.ts
         — keep them in sync (this seam is invisible to the compiler). */
      .route-view[data-route="home"] {     /* violet · hue 265 */
        --accent: rgba(160, 120, 255, 0.45);
        --accent-bg: rgba(28, 18, 56, 0.72);
        --screean-particle:   hsl(265 72% 62%);
        --screean-particle-2: hsl(245 72% 58%);
        --screean-particle-3: hsl(285 72% 66%);
      }
      .route-view[data-route="gallery"] {  /* teal · hue 185 */
        --accent: rgba(80, 200, 220, 0.45);
        --accent-bg: rgba(10, 36, 48, 0.72);
        --screean-particle:   hsl(185 72% 62%);
        --screean-particle-2: hsl(165 72% 58%);
        --screean-particle-3: hsl(205 72% 66%);
      }
      .route-view[data-route="settings"] { /* amber · hue 32 */
        --accent: rgba(255, 180, 80, 0.45);
        --accent-bg: rgba(40, 28, 10, 0.72);
        --screean-particle:   hsl(32 72% 62%);
        --screean-particle-2: hsl(12 72% 58%);
        --screean-particle-3: hsl(52 72% 66%);
      }

      /* Button hover glide between route accents. Hover/transition states
         are live-DOM-only chrome — the rasterizer captures the resting
         computed style, which is exactly what we want. */
      .route-view button {
        transition: background 600ms cubic-bezier(0.25, 0.6, 0.2, 1),
                    border-color 600ms cubic-bezier(0.25, 0.6, 0.2, 1);
      }
      .route-view button:hover {
        background: color-mix(in srgb, var(--accent-bg) 80%, var(--accent) 20%) !important;
        border-color: color-mix(in srgb, var(--accent) 70%, white 10%) !important;
      }

      /* Keyboard focus ring — native :focus-visible on real buttons. */
      #content-host :focus-visible {
        outline: 2px solid rgb(130, 160, 255);
        outline-offset: 3px;
      }

      .hud {
        position: fixed; top: 16px; left: 16px; z-index: 50;
        padding: 10px 14px;
        background: rgba(12, 10, 24, 0.6);
        backdrop-filter: blur(18px) saturate(1.2);
        border: 1px solid rgba(180, 180, 230, 0.1);
        border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: rgba(220, 220, 240, 0.85);
        pointer-events: none; user-select: none;
      }
      .hud h4 {
        margin: 0 0 6px 0; font-size: 9px;
        letter-spacing: 0.2em; text-transform: uppercase;
        color: rgba(180, 180, 220, 0.55); font-weight: 500;
      }
      .hud .row { display: flex; gap: 8px; margin-top: 3px; }
      .hud .key { color: rgba(160, 200, 255, 0.65); min-width: 54px; }
      .hud .val { color: rgba(220, 220, 240, 0.95); }

      .hint {
        position: fixed; bottom: 24px; left: 50%;
        transform: translateX(-50%);
        font-size: 10px; letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(220, 220, 240, 0.3);
        pointer-events: none; user-select: none; z-index: 10;
      }
      .hint kbd {
        font-family: inherit; font-size: 9px;
        padding: 1px 5px; margin: 0 2px; border-radius: 3px;
        background: rgba(220, 220, 240, 0.08);
        border: 1px solid rgba(220, 220, 240, 0.15);
        color: rgba(220, 220, 240, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="world-behind" aria-hidden="true"></div>
    <canvas id="portal"></canvas>
    <div id="content-host"></div>
    <div class="hud" id="hud" aria-live="polite">
      <h4>route</h4>
      <div class="row"><span class="key">at:</span> <span class="val" id="hud-route">—</span></div>
      <div class="row"><span class="key">visits:</span> <span class="val" id="hud-count">0</span></div>
    </div>
    <div class="hint">
      <kbd>Tab</kbd> / click to navigate · the view swaps through particles
    </div>
    <script type="module" src="/src/demos/routing/main.ts"></script>
  </body>
</html>
