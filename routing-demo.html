<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>screean · routing · morph</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #06050d; overflow: hidden;
        color: #e0e0ea;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .world-behind {
        position: fixed; inset: -20%; z-index: 0;
        background:
          radial-gradient(circle at 30% 40%, rgba(140, 100, 255, 0.28), transparent 40%),
          radial-gradient(circle at 70% 60%, rgba(100, 180, 255, 0.22), transparent 45%),
          radial-gradient(circle at 50% 80%, rgba(255, 160, 200, 0.10), transparent 50%);
        filter: blur(40px) saturate(1.2);
        animation: drift 90s linear infinite;
      }
      @keyframes drift {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }

      #portal {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: block; z-index: 1; pointer-events: none;
      }
      #mirror-host {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
      }

      /* Mirror base transition. Opacity ONLY — no scale animation.
         Scaling the mirror while the particle cloud sits at the button's
         full-size silhouette creates a visible "UI grows into place" mismatch
         at the end of the reform beat. Particles are already pixel-accurate
         on the target; the button just fades in over them. */
      #screean-mirror > div {
        transition: opacity 260ms cubic-bezier(0.25, 0.6, 0.2, 1);
      }
      /* Route-themed button accent. main.ts writes
         `data-route="home|gallery|settings"` on the document root; CSS below
         tints button bg + border per route. The same hue is used by the
         particle palette (see main.ts HUES) so cloud and UI match. */
      :root { --accent: rgba(180, 180, 220, 0.14); --accent-bg: rgba(16, 14, 28, 0.72); }
      :root[data-route="home"]     { --accent: rgba(160, 120, 255, 0.45); --accent-bg: rgba(28, 18, 56, 0.72); }
      :root[data-route="gallery"]  { --accent: rgba(80, 200, 220, 0.45);  --accent-bg: rgba(10, 36, 48, 0.72); }
      :root[data-route="settings"] { --accent: rgba(255, 180, 80, 0.45);  --accent-bg: rgba(40, 28, 10, 0.72); }

      /* Visual chrome only — font flows in from the component (inline style)
         so particles + DOM mirror render at one size. */
      #screean-mirror > div[role="button"] {
        background: var(--accent-bg);
        border: 1px solid var(--accent);
        border-radius: 10px;
        backdrop-filter: blur(8px) saturate(1.1);
        color: rgba(230, 232, 240, 0.92);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset,
                    0 4px 16px rgba(0,0,0,0.3);
      }
      /* Background + border transitions for the route-accent shift. Each nav
         glides the theme from old to new route in sync with the particle
         morph. 600ms aligns with the total nav cycle. */
      #screean-mirror > div[role="button"] {
        transition: opacity 260ms cubic-bezier(0.25, 0.6, 0.2, 1),
                    background 600ms cubic-bezier(0.25, 0.6, 0.2, 1),
                    border-color 600ms cubic-bezier(0.25, 0.6, 0.2, 1);
      }
      #screean-mirror > div[role="button"]:hover {
        background: color-mix(in srgb, var(--accent-bg) 80%, var(--accent) 20%);
        border-color: color-mix(in srgb, var(--accent) 70%, white 10%);
      }
      #screean-mirror > div[role="heading"] {
        color: rgba(240, 240, 248, 0.92);
        display: flex; align-items: center; justify-content: center;
        letter-spacing: -0.01em;
      }
      #screean-mirror > div[role="text"] {
        color: rgba(200, 205, 220, 0.65);
        display: flex; align-items: center; justify-content: center;
      }

      /* Keyboard focus ring (visible on Tab, not on pointer). */
      #screean-mirror > div:focus-visible {
        outline: 2px solid rgb(130, 160, 255);
        outline-offset: 3px;
      }
      #screean-mirror > div:focus:not(:focus-visible) { outline: none; }

      .hud {
        position: fixed; top: 16px; left: 16px; z-index: 50;
        padding: 10px 14px;
        background: rgba(12, 10, 24, 0.6);
        backdrop-filter: blur(18px) saturate(1.2);
        border: 1px solid rgba(180, 180, 230, 0.1);
        border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: rgba(220, 220, 240, 0.85);
        /* HUD rows are informational; the toggle row turns pointer-events
           back on for the one interactive control inside. */
        pointer-events: none; user-select: none;
      }
      .hud .toggle { pointer-events: auto; cursor: pointer; }
      .hud .toggle input {
        appearance: none;
        width: 14px; height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(180, 180, 220, 0.35);
        background: rgba(12, 10, 24, 0.5);
        cursor: pointer;
        margin: 0;
        display: inline-block;
        vertical-align: middle;
        position: relative;
      }
      .hud .toggle input:checked {
        background: rgb(130, 160, 255);
        border-color: rgb(130, 160, 255);
      }
      .hud .toggle input:checked::after {
        content: '';
        position: absolute;
        left: 4px; top: 1px;
        width: 4px; height: 8px;
        border: solid rgb(12, 10, 24);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .hud .toggle label {
        color: rgba(220, 220, 240, 0.85); margin-left: 6px;
        vertical-align: middle; cursor: pointer;
      }
      .hud h4 {
        margin: 0 0 6px 0; font-size: 9px;
        letter-spacing: 0.2em; text-transform: uppercase;
        color: rgba(180, 180, 220, 0.55); font-weight: 500;
      }
      .hud .row { display: flex; gap: 8px; margin-top: 3px; }
      .hud .key { color: rgba(160, 200, 255, 0.65); min-width: 54px; }
      .hud .val { color: rgba(220, 220, 240, 0.95); }

      .hint {
        position: fixed; bottom: 24px; left: 50%;
        transform: translateX(-50%);
        font-size: 10px; letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(220, 220, 240, 0.3);
        pointer-events: none; user-select: none; z-index: 10;
      }
      .hint kbd {
        font-family: inherit; font-size: 9px;
        padding: 1px 5px; margin: 0 2px; border-radius: 3px;
        background: rgba(220, 220, 240, 0.08);
        border: 1px solid rgba(220, 220, 240, 0.15);
        color: rgba(220, 220, 240, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="world-behind" aria-hidden="true"></div>
    <canvas id="portal"></canvas>
    <div id="mirror-host"></div>
    <div class="hud" id="hud" aria-live="polite">
      <h4>route</h4>
      <div class="row"><span class="key">at:</span> <span class="val" id="hud-route">—</span></div>
      <div class="row"><span class="key">visits:</span> <span class="val" id="hud-count">0</span></div>
      <div class="row toggle">
        <input type="checkbox" id="toggle-pointer" checked />
        <label for="toggle-pointer">pointer pull</label>
      </div>
    </div>
    <div class="hint">
      <kbd>Tab</kbd> / click to navigate · the particles morph
    </div>
    <script type="module" src="/src/routing-demo/main.ts"></script>
  </body>
</html>
